# Abre PRs automáticos quando sair atualização de segurança das dependências
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next", "react", "react-dom"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
